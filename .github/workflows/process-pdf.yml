name: Process PDF translation

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: Supabase translation_jobs UUID
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: pdf-${{ inputs.job_id }}
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: worker/requirements.txt

      - name: Install XeLaTeX and CJK fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-xetex texlive-latex-extra texlive-fonts-recommended texlive-lang-cjk \
            fonts-noto-core fonts-noto-cjk

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && pip install -r worker/requirements.txt

      - name: Process PDF
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-5.6-luna
          MAX_PAGES: '20'
        run: python -m worker.run_job '${{ inputs.job_id }}'
