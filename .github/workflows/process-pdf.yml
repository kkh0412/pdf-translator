name: PDF translation worker

on:
  workflow_dispatch:
  schedule:
    # GitHub scheduled workflows support 5-minute granularity.
    - cron: '3-58/5 * * * *'
    # Keep scheduled workflows active in a public repository.
    - cron: '17 4 1 * *'

permissions:
  contents: write

concurrency:
  group: pdf-translation-worker
  cancel-in-progress: false

jobs:
  worker:
    if: github.event_name != 'schedule' || github.event.schedule != '17 4 1 * *'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # Check the queue first using Ubuntu's built-in Python. If there is no work,
      # the job ends here without setting up Python packages.
      - name: Check Supabase queue
        id: queue
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        shell: bash
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SECRET_KEY" ]; then
            echo "Repository variable SUPABASE_URL and secret SUPABASE_SECRET_KEY are required." >&2
            exit 1
          fi
          HAS_JOBS="$(python3 worker/check_queue.py)"
          echo "has_jobs=$HAS_JOBS" >> "$GITHUB_OUTPUT"
          echo "Queued jobs: $HAS_JOBS"

      - name: Set up Python
        if: steps.queue.outputs.has_jobs == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: worker/requirements.txt

      - name: Install Python dependencies
        if: steps.queue.outputs.has_jobs == 'true'
        run: pip install --disable-pip-version-check -r worker/requirements.txt

      - name: Process queued PDFs
        if: steps.queue.outputs.has_jobs == 'true'
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-5.6-luna
          MAX_PAGES: '20'
        run: python -m worker.run_pending --max-jobs 3

  heartbeat:
    if: github.event_name == 'schedule' && github.event.schedule == '17 4 1 * *'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Record monthly activity
        shell: bash
        run: |
          date -u '+%Y-%m-%dT%H:%M:%SZ' > .github/worker-heartbeat.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/worker-heartbeat.txt
          git diff --cached --quiet && exit 0
          git commit -m 'chore: keep scheduled worker active'
          git push
