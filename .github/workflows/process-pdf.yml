name: PDF translation worker

on:
  workflow_dispatch:
  schedule:
    - cron: '3-58/5 * * * *'
    - cron: '17 4 1 * *'

permissions:
  contents: write

concurrency:
  group: pdf-translation-worker
  cancel-in-progress: false

jobs:
  worker:
    if: github.event_name != 'schedule' || github.event.schedule != '17 4 1 * *'
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Check Supabase queue
        id: queue
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        shell: bash
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SECRET_KEY" ]; then
            echo "Repository variable SUPABASE_URL and secret SUPABASE_SECRET_KEY are required." >&2
            exit 1
          fi
          HAS_JOBS="$(python3 worker/check_queue.py)"
          echo "has_jobs=$HAS_JOBS" >> "$GITHUB_OUTPUT"
          echo "Queued jobs: $HAS_JOBS"

      - name: Restore prepared runtime cache
        if: steps.queue.outputs.has_jobs == 'true'
        id: runtime-cache
        uses: actions/cache/restore@v5
        with:
          path: |
            ~/.TinyTeX
            ~/.cache/pdf-translator-fonts
            .venv
          key: ${{ runner.os }}-${{ runner.arch }}-pdf-translator-runtime-v5-${{ hashFiles('worker/requirements.txt', 'worker/latex_requirements.txt') }}

      - name: Build runtime only on cache miss
        if: steps.queue.outputs.has_jobs == 'true' && steps.runtime-cache.outputs.cache-hit != 'true'
        shell: bash
        run: bash worker/setup_runtime.sh

      # Important: save BEFORE translation. In the previous workflow the cache
      # was only saved in the post-job hook, which GitHub skips when the job
      # fails. That was why TinyTeX kept downloading after failed PDF tests.
      - name: Save prepared runtime cache immediately
        if: steps.queue.outputs.has_jobs == 'true' && steps.runtime-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            ~/.TinyTeX
            ~/.cache/pdf-translator-fonts
            .venv
          key: ${{ steps.runtime-cache.outputs.cache-primary-key }}

      - name: Process queued PDFs
        if: steps.queue.outputs.has_jobs == 'true'
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.5-flash-lite
          BOOK_FONT_DIR: /home/runner/.cache/pdf-translator-fonts
          MAX_PAGES: '20'
        shell: bash
        run: |
          export PATH="$HOME/.TinyTeX/bin/x86_64-linux:$PATH"
          test -x .venv/bin/python
          xelatex --version | head -1
          .venv/bin/python -m worker.run_pending --max-jobs 3

  heartbeat:
    if: github.event_name == 'schedule' && github.event.schedule == '17 4 1 * *'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Record monthly activity
        shell: bash
        run: |
          date -u '+%Y-%m-%dT%H:%M:%SZ' > .github/worker-heartbeat.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/worker-heartbeat.txt
          git diff --cached --quiet && exit 0
          git commit -m 'chore: keep scheduled worker active'
          git push
