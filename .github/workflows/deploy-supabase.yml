name: Deploy Supabase backend

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: latest

      - name: Configure Supabase function secrets
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          ACTIONS_TOKEN: ${{ secrets.GITHUB_ACTIONS_TOKEN }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          GITHUB_OWNER: ${{ github.repository_owner }}
          GITHUB_REPO: ${{ github.event.repository.name }}
        run: |
          supabase secrets set \
            GITHUB_ACTIONS_TOKEN="$ACTIONS_TOKEN" \
            GITHUB_OWNER="$GITHUB_OWNER" \
            GITHUB_REPO="$GITHUB_REPO" \
            ADMIN_TOKEN="$ADMIN_TOKEN" \
            --project-ref "$PROJECT_REF"

      - name: Deploy authenticated functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          supabase functions deploy create-job --no-verify-jwt --project-ref "$PROJECT_REF"
          supabase functions deploy start-job --no-verify-jwt --project-ref "$PROJECT_REF"

      - name: Deploy admin function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: supabase functions deploy admin-jobs --no-verify-jwt --project-ref "$PROJECT_REF"
