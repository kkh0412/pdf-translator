name: PDF translation worker

on:
  workflow_dispatch:
  schedule:
    - cron: '3-58/5 * * * *'
    - cron: '17 4 1 * *'

permissions:
  contents: write

concurrency:
  group: pdf-translation-worker
  cancel-in-progress: false

jobs:
  worker:
    if: github.event_name != 'schedule' || github.event.schedule != '17 4 1 * *'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Check Supabase queue
        id: queue
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        shell: bash
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SECRET_KEY" ]; then
            echo "Repository variable SUPABASE_URL and secret SUPABASE_SECRET_KEY are required." >&2
            exit 1
          fi
          HAS_JOBS="$(python3 worker/check_queue.py)"
          echo "has_jobs=$HAS_JOBS" >> "$GITHUB_OUTPUT"
          echo "Queued jobs: $HAS_JOBS"

      - name: Set up Python
        if: steps.queue.outputs.has_jobs == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: worker/requirements.txt

      - name: Install Python dependencies
        if: steps.queue.outputs.has_jobs == 'true'
        run: pip install --disable-pip-version-check -r worker/requirements.txt

      - name: Restore LaTeX and book-font cache
        if: steps.queue.outputs.has_jobs == 'true'
        id: latex-cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.TinyTeX
            ~/.cache/pdf-translator-fonts
          # New key fixes the old cache that was missing cjk-ko.
          # restore-keys lets us reuse the old TinyTeX download and only add
          # the missing package on the first v5.1 run.
          key: ${{ runner.os }}-pdf-translator-latex-v5-3-direct-kp-fonts-2026-08
          restore-keys: |
            ${{ runner.os }}-pdf-translator-latex-v5-

      - name: Add TinyTeX to PATH
        if: steps.queue.outputs.has_jobs == 'true'
        shell: bash
        run: |
          echo "$HOME/.TinyTeX/bin/x86_64-linux" >> "$GITHUB_PATH"

      - name: Install TinyTeX only if cache is empty
        if: steps.queue.outputs.has_jobs == 'true'
        shell: bash
        run: |
          set -euxo pipefail
          export PATH="$HOME/.TinyTeX/bin/x86_64-linux:$PATH"
          if ! command -v xelatex >/dev/null 2>&1; then
            export TINYTEX_VERSION=2026.07
            export TINYTEX_INSTALLER=TinyTeX-1
            curl -fsSL https://yihui.org/tinytex/install-unx.sh | sh
          fi

      - name: Ensure required LaTeX packages and book fonts
        if: steps.queue.outputs.has_jobs == 'true'
        shell: bash
        run: |
          set -euxo pipefail
          export PATH="$HOME/.TinyTeX/bin/x86_64-linux:$PATH"

          # Install only packages actually loaded by translated.tex.
          # kpfonts-otf is installed ONLY as a source of Kp OTF font files.
          # We deliberately do not load kpfonts-otf.sty, so its
          # realscripts/unicode-math dependencies are irrelevant.
          tlmgr install \
            kpfonts-otf \
            xetexko \
            cjk-ko \
            enumitem \
            geometry \
            graphics \
            amsmath \
            amsfonts

          # Verify every .sty used by our generated preamble.
          kpsewhich fontspec.sty
          kpsewhich xetexko.sty
          kpsewhich kolabels-utf.sty
          kpsewhich geometry.sty
          kpsewhich graphicx.sty
          kpsewhich enumitem.sty
          kpsewhich amsmath.sty
          kpsewhich amssymb.sty

          mkdir -p "$HOME/.cache/pdf-translator-fonts"

          # Download Korean book fonts once; actions/cache reuses them.
          if [ ! -f "$HOME/.cache/pdf-translator-fonts/NanumMyeongjo-Regular.ttf" ]; then
            curl -fL --retry 3 \
              -o "$HOME/.cache/pdf-translator-fonts/NanumMyeongjo-Regular.ttf" \
              https://raw.githubusercontent.com/google/fonts/main/ofl/nanummyeongjo/NanumMyeongjo-Regular.ttf
          fi
          if [ ! -f "$HOME/.cache/pdf-translator-fonts/NanumMyeongjo-Bold.ttf" ]; then
            curl -fL --retry 3 \
              -o "$HOME/.cache/pdf-translator-fonts/NanumMyeongjo-Bold.ttf" \
              https://raw.githubusercontent.com/google/fonts/main/ofl/nanummyeongjo/NanumMyeongjo-Bold.ttf
          fi

          # Copy Kp font files out of the TeX tree into the persistent font cache.
          for font in \
            KpRoman-Regular.otf \
            KpRoman-Italic.otf \
            KpRoman-Bold.otf \
            KpRoman-BoldItalic.otf \
            KpSans-Regular.otf \
            KpSans-Italic.otf \
            KpSans-Bold.otf \
            KpSans-BoldItalic.otf
          do
            src="$(kpsewhich "$font")"
            test -n "$src"
            cp -f "$src" "$HOME/.cache/pdf-translator-fonts/$font"
          done

          test -f "$HOME/.cache/pdf-translator-fonts/NanumMyeongjo-Regular.ttf"
          test -f "$HOME/.cache/pdf-translator-fonts/NanumMyeongjo-Bold.ttf"
          test -f "$HOME/.cache/pdf-translator-fonts/KpRoman-Regular.otf"
          test -f "$HOME/.cache/pdf-translator-fonts/KpRoman-Italic.otf"
          test -f "$HOME/.cache/pdf-translator-fonts/KpRoman-Bold.otf"
          test -f "$HOME/.cache/pdf-translator-fonts/KpRoman-BoldItalic.otf"

      - name: Compile LaTeX smoke test
        if: steps.queue.outputs.has_jobs == 'true'
        shell: bash
        run: |
          set -euxo pipefail
          export PATH="$HOME/.TinyTeX/bin/x86_64-linux:$PATH"

          testdir="$(mktemp -d)"
          mkdir -p "$testdir/font"
          cp "$HOME/.cache/pdf-translator-fonts/NanumMyeongjo-Regular.ttf" "$testdir/font/"
          cp "$HOME/.cache/pdf-translator-fonts/NanumMyeongjo-Bold.ttf" "$testdir/font/"
          cp "$HOME/.cache/pdf-translator-fonts/KpRoman-Regular.otf" "$testdir/font/"
          cp "$HOME/.cache/pdf-translator-fonts/KpRoman-Italic.otf" "$testdir/font/"
          cp "$HOME/.cache/pdf-translator-fonts/KpRoman-Bold.otf" "$testdir/font/"
          cp "$HOME/.cache/pdf-translator-fonts/KpRoman-BoldItalic.otf" "$testdir/font/"

          cat > "$testdir/smoke.tex" <<'EOF'
          \documentclass[10pt]{article}
          \usepackage{fontspec}
          \usepackage{xetexko}
          \usepackage{geometry}
          \usepackage{graphicx}
          \usepackage{enumitem}
          \usepackage{amsmath,amssymb}
          \geometry{margin=22mm}
          \setmainfont[
            Path={font/},
            UprightFont=KpRoman-Regular.otf,
            ItalicFont=KpRoman-Italic.otf,
            BoldFont=KpRoman-Bold.otf,
            BoldItalicFont=KpRoman-BoldItalic.otf
          ]{KpRoman-Regular.otf}
          \setmainhangulfont[
            Path={font/},
            UprightFont=NanumMyeongjo-Regular.ttf,
            BoldFont=NanumMyeongjo-Bold.ttf,
            ItalicFont=NanumMyeongjo-Regular.ttf,
            ItalicFeatures={FakeSlant=0.13},
            BoldItalicFont=NanumMyeongjo-Bold.ttf,
            BoldItalicFeatures={FakeSlant=0.13}
          ]{NanumMyeongjo-Regular.ttf}
          \begin{document}
          \textsc{Contents}
          \begin{center}\large\scshape PH653. Quantum Field Theory I\end{center}
          \textit{For Once, Then, Something}

          \textbf{1. 국소성 원리} (1강)

          한국어 본문과 English text, 수식 $E=mc^2$.
          \begin{itemize}
            \item 물리학에서의 국소성
          \end{itemize}
          \end{document}
          EOF

          (cd "$testdir" && xelatex -interaction=nonstopmode -halt-on-error -file-line-error smoke.tex)
          test -s "$testdir/smoke.pdf"
          rm -rf "$testdir"

      - name: Process queued PDFs
        if: steps.queue.outputs.has_jobs == 'true'
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.5-flash-lite
          BOOK_FONT_DIR: /home/runner/.cache/pdf-translator-fonts
          MAX_PAGES: '20'
        run: |
          xelatex --version | head -1
          python -m worker.run_pending --max-jobs 3

  heartbeat:
    if: github.event_name == 'schedule' && github.event.schedule == '17 4 1 * *'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Record monthly activity
        shell: bash
        run: |
          date -u '+%Y-%m-%dT%H:%M:%SZ' > .github/worker-heartbeat.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/worker-heartbeat.txt
          git diff --cached --quiet && exit 0
          git commit -m 'chore: keep scheduled worker active'
          git push
