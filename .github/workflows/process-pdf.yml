name: PDF translation worker

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: 'Supabase translation_jobs UUID. Leave empty to process the queue.'
        required: false
        type: string
  schedule:
    # Normal jobs start on demand from the Supabase Edge Function.
    # This 15-minute schedule is only a recovery path.
    - cron: '7,22,37,52 * * * *'
    - cron: '17 4 1 * *'

permissions:
  contents: write

concurrency:
  group: pdf-translation-worker
  cancel-in-progress: false

jobs:
  worker:
    if: github.event_name != 'schedule' || github.event.schedule != '17 4 1 * *'
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Resolve requested translation job
        id: target
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_JOB_ID: ${{ inputs.job_id }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        shell: bash
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ -n "$REQUESTED_JOB_ID" ]; then
            echo "has_jobs=true" >> "$GITHUB_OUTPUT"
            echo "mode=single" >> "$GITHUB_OUTPUT"
            echo "job_id=$REQUESTED_JOB_ID" >> "$GITHUB_OUTPUT"
            echo "Immediate job requested: $REQUESTED_JOB_ID"
            exit 0
          fi

          HAS_JOBS="$(python3 worker/check_queue.py)"
          echo "has_jobs=$HAS_JOBS" >> "$GITHUB_OUTPUT"
          echo "mode=queue" >> "$GITHUB_OUTPUT"
          echo "job_id=" >> "$GITHUB_OUTPUT"
          echo "Fallback queue check: $HAS_JOBS"

      - name: Restore prepared PDF runtime
        if: steps.target.outputs.has_jobs == 'true'
        id: runtime-cache
        uses: actions/cache/restore@v5
        with:
          path: |
            ~/.TinyTeX
            ~/.cache/pdf-translator-fonts
            .venv
          key: ${{ runner.os }}-${{ runner.arch }}-pdf-translator-runtime-v6-${{ hashFiles('worker/requirements.txt', 'worker/latex_requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-pdf-translator-runtime-v6-

      - name: Build runtime only on first cache miss
        if: steps.target.outputs.has_jobs == 'true' && steps.runtime-cache.outputs.cache-hit != 'true'
        run: bash worker/setup_runtime.sh

      - name: Save runtime before document processing
        if: steps.target.outputs.has_jobs == 'true' && steps.runtime-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            ~/.TinyTeX
            ~/.cache/pdf-translator-fonts
            .venv
          key: ${{ steps.runtime-cache.outputs.cache-primary-key }}

      - name: Verify Python runtime dependencies
        if: steps.target.outputs.has_jobs == 'true'
        shell: bash
        run: bash worker/ensure_python_runtime.sh

      - name: Run translation routing regression tests
        if: steps.target.outputs.has_jobs == 'true'
        shell: bash
        run: .venv/bin/python -m unittest discover -s worker/tests -v

      - name: Process requested PDF
        if: steps.target.outputs.has_jobs == 'true'
        env:
          MODE: ${{ steps.target.outputs.mode }}
          JOB_ID: ${{ steps.target.outputs.job_id }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PY_GOOGLE_TRANSLATE_TIMEOUT_SECONDS: '12'
          PY_GOOGLE_TRANSLATE_SERVICE_URLS: translate.googleapis.com,translate.google.com,translate.google.co.kr
          GEMINI_VISION_MODEL: gemini-3.5-flash-lite
          GEMINI_TRANSLATION_MODEL: gemini-3.5-flash-lite
          GEMINI_VISION_MODELS: gemini-3.5-flash-lite,gemini-3.1-flash-lite,gemini-2.5-flash-lite,gemini-2.5-flash,gemini-3.5-flash,gemini-3.6-flash
          GEMINI_TRANSLATION_MODELS: gemini-3.5-flash-lite,gemini-3.1-flash-lite,gemini-2.5-flash-lite,gemini-2.5-flash,gemini-3.5-flash,gemini-3.6-flash
          VISION_PAGES_PER_CALL: '2'
          VISION_WORKERS: '2'
          TRANSLATION_WORKERS: '2'
          GEMINI_SAFE_RPM: '18'
          BOOK_FONT_DIR: /home/runner/.cache/pdf-translator-fonts
          MAX_PAGES: '100'
        shell: bash
        run: |
          export PATH="$HOME/.TinyTeX/bin/x86_64-linux:$PATH"

          if [ "$MODE" = "single" ] && [ -n "$JOB_ID" ]; then
            echo "Processing requested job immediately: $JOB_ID"
            .venv/bin/python -m worker.run_job "$JOB_ID"
          else
            echo "Processing one queued recovery job."
            .venv/bin/python -m worker.run_pending --max-jobs 1
          fi

  heartbeat:
    if: github.event_name == 'schedule' && github.event.schedule == '17 4 1 * *'
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Record monthly activity
        shell: bash
        run: |
          date -u '+%Y-%m-%dT%H:%M:%SZ' > .github/worker-heartbeat.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/worker-heartbeat.txt
          git diff --cached --quiet && exit 0
          git commit -m 'chore: keep scheduled worker active'
          git push
