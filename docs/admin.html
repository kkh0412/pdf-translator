<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PDF Translator Admin</title>
  <link rel="stylesheet" href="./style.css" />
  <style>
    .admin-card { margin-top: 48px; }
    .admin-controls { display:grid; grid-template-columns:1fr auto; gap:12px; }
    .admin-controls input { min-height:52px; border:1px solid #c9c7c0; border-radius:9px; padding:0 14px; }
    .jobs { margin-top:24px; display:grid; gap:12px; }
    .job { border:1px solid #deddd7; border-radius:12px; padding:18px; background:#faf9f5; }
    .job-head { display:flex; justify-content:space-between; gap:12px; align-items:flex-start; }
    .job h3 { margin:0 0 6px; font-size:16px; word-break:break-all; }
    .job p { margin:4px 0; font-size:13px; color:#66645e; }
    .job-links { display:flex; gap:10px; margin-top:12px; flex-wrap:wrap; }
    .job-links a { font-size:13px; font-weight:700; }
    @media(max-width:720px){.admin-controls{grid-template-columns:1fr}.job-head{flex-direction:column}}
  </style>
</head>
<body>
  <main class="shell">
    <nav class="topbar"><a class="brand" href="./">PDF TRANSLATOR</a><a class="admin-link" href="./">사용자 화면</a></nav>
    <section class="hero" style="padding-bottom:28px">
      <div class="eyebrow">ADMIN</div>
      <h1 style="font-size:clamp(38px,6vw,64px)">업로드 파일과<br />번역 작업</h1>
    </section>
    <section class="card admin-card">
      <div id="setupWarning" class="setup-warning hidden"><strong>Supabase 설정이 필요합니다.</strong><span><code>docs/config.js</code>를 먼저 설정하세요.</span></div>
      <div class="admin-controls">
        <input id="adminToken" type="password" autocomplete="current-password" placeholder="Supabase에 설정한 ADMIN_TOKEN 입력" />
        <button id="loadBtn" class="primary" type="button">목록 불러오기</button>
      </div>
      <div id="errorBox" class="error hidden"></div>
      <div id="jobs" class="jobs"></div>
    </section>
  </main>
  <script src="./config.js"></script>
  <script src="./admin.js"></script>
</body>
</html>
